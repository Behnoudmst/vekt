allowBuilds:
  '@parcel/watcher': set this to true or false
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - tree-sitter
  - tree-sitter-json
